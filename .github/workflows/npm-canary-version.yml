name: npm canary version

on:
  push:
    branches: [main]
    paths: [npm-publishing-canary/**, .github/workflows/npm-canary-version.yml]

permissions:
  contents: read

concurrency:
  group: npm-canary-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - name: Install the qualified development inputs
        working-directory: npm-publishing-canary
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect the official release plan
        id: plan
        working-directory: npm-publishing-canary
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: npm run release:status
      - name: Preserve owner PR and commit identity
        if: steps.plan.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=main -f "head=${GITHUB_REPOSITORY%%/*}:changeset-release/main" \
            --jq 'if length <= 1 and all(.[]; .user.type == "User" and .user.login == "777genius") then true else error("Only an existing owner release PR can be reused") end'
          git config --local user.name iliya
          git config --local user.email iliyazelenkog@gmail.com
      - name: Generate and check the version branch
        if: steps.plan.outputs.has_release == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: npm-publishing-canary
          setupGitUser: false
          createGithubReleases: false
          version: npm run release:version
          title: "chore(release): version npm canary"
          commit: "chore(release): version npm canary"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          GIT_AUTHOR_NAME: iliya
          GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
          GIT_COMMITTER_NAME: iliya
          GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
